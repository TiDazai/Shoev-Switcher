name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match the app version)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Import Developer ID certificate
        if: env.CERTIFICATE_BASE64 != '' && env.SIGN_IDENTITY != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/shoev-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Test and create universal DMG
        run: |
          ./scripts/prepare-lexicon.sh
          swift test
          ./scripts/create-dmg.sh
      - name: Notarize
        if: env.CERTIFICATE_BASE64 != '' && env.SIGN_IDENTITY != '' && env.APPLE_ID != ''
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize.sh
      - name: Attach verified DMG to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          hdiutil verify dist/Shoev-Switcher.dmg
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          gh release upload "$RELEASE_TAG" dist/Shoev-Switcher.dmg --clobber
