name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare embedded lexicon
        run: ./scripts/prepare-lexicon.sh

      - name: Import Developer ID certificate
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/shoev-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Test
        run: swift test

      - name: Build and sign
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Create DMG
        run: ./scripts/create-dmg.sh

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: ./scripts/notarize.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "dist/Shoev-Switcher.dmg" --clobber

  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 build
        run: dotnet publish windows/ShoevSwitcher.Windows/ShoevSwitcher.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Verify Windows build
        shell: pwsh
        run: |
          $core = Start-Process -FilePath "dist/windows/Shoev Switcher.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($core.ExitCode -ne 0) { throw "Core self-test failed" }
          $input = Start-Process -FilePath "dist/windows/Shoev Switcher.exe" -ArgumentList "--input-self-test" -Wait -PassThru
          if ($input.ExitCode -ne 0) { throw "Input self-test failed" }
      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Shoev-Switcher-x64.zip
      - name: Attach Windows build to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME dist/Shoev-Switcher-x64.zip --clobber
