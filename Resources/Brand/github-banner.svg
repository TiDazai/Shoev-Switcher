  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#c99b47" stroke-opacity=".4"/>
  <circle cx="1140" cy="0" r="270" fill="none" stroke="#e2ba6d" stroke-opacity=".15"/>
  <circle cx="1140" cy="0" r="320" fill="none" stroke="#e2ba6d" stroke-opacity=".09"/>
  <path d="M48 330H1152" stroke="#d9ad55" stroke-opacity=".3"/>
