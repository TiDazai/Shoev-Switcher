<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">SHOEV SYSTEMS · Shoev Switcher</title>
  <desc id="desc">Белая керамика и шлифованная платина. Раскладка и орфография в одном приложении для Mac.</desc>
