  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#a9adb4" stroke-opacity=".4"/>
  <circle cx="1140" cy="0" r="270" fill="none" stroke="#d6d9df" stroke-opacity=".15"/>
