    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5f7"/></linearGradient>
    <linearGradient id="platinum" x2="1" y2=".25"><stop stop-color="#333e4a"/><stop offset=".5" stop-color="#67727f"/><stop offset="1" stop-color="#353f4b"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V9M3 0V9M6 0V9" stroke="#617080" stroke-width=".3" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
